<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cookie Parser Tool</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 200px; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; margin-right: 10px; }
        .btn-conv { background-color: #2c3e50; }
        .btn-csv { background-color: #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .cookie-cell { max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>Parser Data UID|PASS|COOKIE</h2>
    <textarea id="rawInput" placeholder="Tempel data di sini..."></textarea>
    <div>
        <button class="btn btn-conv" onclick="prosesData()">Konversi ke Tabel</button>
        <button class="btn btn-csv" onclick="downloadCSV()">Download .CSV (Excel)</button>
    </div>

    <div id="outputArea"></div>
</div>

<script>
    let currentData = [];

    function prosesData() {
        const input = document.getElementById('rawInput').value;
        const lines = input.trim().split('\n');
        currentData = [];
        let html = '<table><thead><tr><th>UID</th><th>Password</th><th>Cookie</th></tr></thead><tbody>';

        lines.forEach(line => {
            if (!line.trim()) return;
            
            // Logic: Mencari pemisah pertama dan kedua saja, sisa baris dianggap cookie
            const firstPipe = line.indexOf('|');
            const secondPipe = line.indexOf('|', firstPipe + 1);
            
            if (firstPipe !== -1 && secondPipe !== -1) {
                const uid = line.substring(0, firstPipe);
                const pass = line.substring(firstPipe + 1, secondPipe);
                const cookie = line.substring(secondPipe + 1); // Ambil SEMUA sisa baris
                
                currentData.push({ uid, pass, cookie });
                html += `<tr><td>${uid}</td><td>${pass}</td><td class="cookie-cell">${cookie}</td></tr>`;
            }
        });

        html += '</tbody></table>';
        document.getElementById('outputArea').innerHTML = html;
    }

    function downloadCSV() {
        if (currentData.length === 0) { alert('Proses data dulu!'); return; }
        
        let csvContent = "data:text/csv;charset=utf-8,UID,Password,Cookie\n";
        currentData.forEach(row => {
            // Escape quote untuk CSV
            let cookie = row.cookie.replace(/"/g, '""');
            csvContent += `${row.uid},${row.pass},"${cookie}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "data_akun.csv");
        document.body.appendChild(link);
        link.click();
    }
</script>

</body>
</html>
